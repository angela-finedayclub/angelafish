<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住宿簡介產生器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans TC", sans-serif;
  background: #f0efea;
  color: #1a1a1a;
}

/* ── UI Shell ── */
.ui-shell {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 20px 40px;
}
.ui-shell h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.ui-shell .sub { font-size: 12px; color: #999; margin-bottom: 24px; }

.panel { background: #fff; border: 1px solid #e0dfd8; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
.panel-title { font-size: 11px; font-weight: 600; color: #999; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; }

.url-row { display: flex; gap: 8px; }
.url-row input { flex: 1; font-size: 14px; padding: 9px 12px; border: 1px solid #d5d5d0; border-radius: 8px; outline: none; background: #fafaf8; }
.url-row input:focus { border-color: #999; background: #fff; }
.url-row button { padding: 9px 20px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.url-row button:hover { background: #333; }
.hint { font-size: 12px; color: #aaa; margin-top: 8px; line-height: 1.7; }

.col-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 10px; }
.col-grid2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.col-item { background: #f7f6f2; border: 1px solid #e0dfd8; border-radius: 8px; padding: 8px 10px; text-align: center; }
.col-item .lbl { font-size: 11px; font-weight: 600; color: #555; margin-bottom: 2px; }
.col-item .sub2 { font-size: 10px; color: #bbb; margin-bottom: 4px; }
.col-item select { width: 100%; font-size: 11px; padding: 2px 4px; border: 1px solid #d5d5d0; border-radius: 4px; background: #fff; }

.err { background: #fff0f0; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
.status-msg { font-size: 13px; color: #999; padding: 8px 0; display: none; }

.action-bar { display: flex; gap: 10px; margin-top: 16px; }
.action-bar button { flex: 1; padding: 10px; border: 1px solid #d5d5d0; background: #fff; border-radius: 8px; font-size: 13px; cursor: pointer; color: #1a1a1a; }
.action-bar button:hover { background: #f5f5f0; }
.action-bar button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.action-bar button.primary:hover { background: #333; }

/* ── Document pages ── */
.page {
  width: 210mm;
  margin: 0 auto 20px;
  background: #fff;
  padding: 44px 52px;
}

/* Cover */
.cover-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; color: #bbb; text-transform: uppercase; margin-bottom: 32px; }
.cover-list { list-style: none; }
.cover-row { display: flex; align-items: baseline; padding: 13px 0; border-bottom: 1px solid #ebebeb; }
.cover-row:first-child { border-top: 1px solid #ebebeb; }
.cover-date { font-size: 13px; color: #aaa; width: 130px; flex-shrink: 0; }
.cover-loc  { font-size: 13px; color: #aaa; width: 64px; flex-shrink: 0; }
.cover-name { font-size: 15px; color: #1a1a1a; }

/* Hotel page */
.hotel-meta { margin-bottom: 20px; }
.date-line     { font-size: 13px; color: #aaa; margin-bottom: 5px; }
.location-line { font-size: 24px; font-weight: 300; color: #888; line-height: 1.2; margin-bottom: 1px; }
.name-line     { font-size: 32px; font-weight: 600; color: #1a1a1a; line-height: 1.15; }

/* Photos */
.photos-wrap { margin-bottom: 24px; }
.photos-row { display: flex; gap: 8px; }
.photos-row img { flex: 1; min-width: 0; height: 200px; object-fit: cover; border-radius: 5px; display: block; }
.photos-row.p1 img { height: 240px; }
.photos-row.p3 img { height: 185px; }
.photos-row.p4 img { height: 170px; }
.photo-placeholder {
  flex: 1; height: 200px; background: #f5f4f0; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: #ccc; font-size: 13px; border: 1px dashed #ddd;
}

/* Upload strip */
.upload-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.upload-slot { position: relative; }
.upload-slot label {
  display: flex; align-items: center; gap: 6px; cursor: pointer;
  font-size: 12px; color: #666; padding: 6px 12px;
  border: 1px dashed #ccc; border-radius: 6px; background: #fafaf8; white-space: nowrap;
}
.upload-slot label:hover { background: #f0efea; border-color: #aaa; }
.upload-slot input[type=file] { display: none; }
.fname { font-size: 11px; color: #16a34a; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
.rm-btn {
  position: absolute; top: -6px; right: -6px;
  width: 18px; height: 18px; background: #e74c3c; color: #fff;
  border: none; border-radius: 50%; font-size: 11px; cursor: pointer;
  display: none; align-items: center; justify-content: center;
}

/* Info */
.info-section { border-top: 1px solid #ebebeb; padding-top: 20px; }
.info-row { display: flex; gap: 20px; margin-bottom: 12px; align-items: flex-start; }
.info-label { font-size: 11px; font-weight: 600; color: #bbb; letter-spacing: .06em; text-transform: uppercase; min-width: 44px; padding-top: 3px; flex-shrink: 0; }
.info-val { font-size: 14px; color: #1a1a1a; line-height: 1.8; flex: 1; }

/* Print */
@page { margin: 0; size: A4; }
@media print {
  body { background: #fff; }
  .ui-shell { display: none !important; }
  .upload-strip { display: none !important; }
  .page { margin: 0; width: 100%; padding: 44px 52px; break-inside: avoid; page-break-inside: avoid; }
  .page + .page { page-break-before: always; break-before: page; }
  .photo-placeholder { border: 1px solid #eee; }
}
.copy-notice { font-size: 12px; color: #16a34a; text-align: center; margin-top: 6px; display: none; }
</style>
</head>
<body>

<!-- ══ UI Shell ══ -->
<div class="ui-shell">
  <h1>🏨 住宿簡介產生器</h1>
  <p class="sub">從 Google Sheet 載入資料，產生可交給客人的住宿簡介文件</p>

  <div class="panel">
    <div class="panel-title">Google Sheet 網址</div>
    <div class="url-row">
      <input type="text" id="sheetUrl" placeholder="貼入 Google Sheet 網址...">
      <button onclick="loadSheet()">載入資料</button>
    </div>
    <p class="hint">Sheet 需設為「知道連結的人可以檢視」。每個新案子換貼新網址即可。</p>
  </div>

  <div class="panel">
    <div class="panel-title">欄位對應（依你的 Sheet 調整）</div>
    <div class="col-grid">
      <div class="col-item"><div class="lbl">類別</div><div class="sub2">住宿篩選</div>
        <select id="col-cat">
          <option value="0" selected>A欄</option><option value="1">B欄</option><option value="2">C欄</option>
          <option value="3">D欄</option><option value="4">E欄</option><option value="-1">（無）</option>
        </select></div>
      <div class="col-item"><div class="lbl">地點</div><div class="sub2">京都/奈良...</div>
        <select id="col-loc">
          <option value="0">A欄</option><option value="1">B欄</option><option value="2" selected>C欄</option>
          <option value="3">D欄</option><option value="4">E欄</option><option value="-1">（無）</option>
        </select></div>
      <div class="col-item"><div class="lbl">酒店名稱</div><div class="sub2">主標題</div>
        <select id="col-name">
          <option value="0">A欄</option><option value="1">B欄</option><option value="2">C欄</option>
          <option value="3" selected>D欄</option><option value="4">E欄</option><option value="-1">（無）</option>
        </select></div>
      <div class="col-item"><div class="lbl">日期</div><div class="sub2">入退住</div>
        <select id="col-date">
          <option value="0">A欄</option><option value="1">B欄</option><option value="2">C欄</option>
          <option value="3">D欄</option><option value="4" selected>E欄</option><option value="-1">（無）</option>
        </select></div>
      <div class="col-item"><div class="lbl">說明</div><div class="sub2">房型/特色</div>
        <select id="col-desc">
          <option value="0">A欄</option><option value="1">B欄</option><option value="2">C欄</option>
          <option value="3">D欄</option><option value="4">E欄</option><option value="5" selected>F欄</option>
          <option value="-1">（無）</option>
        </select></div>
    </div>
    <div style="font-size:11px;color:#bbb;margin:10px 0 8px;">照片欄（Sheet 填圖片網址，最多4欄；也可在下方直接上傳）</div>
    <div class="col-grid2">
      <div class="col-item"><div class="lbl">照片1</div>
        <select id="col-p1">
          <option value="0">A欄</option><option value="1">B欄</option><option value="2">C欄</option>
          <option value="3">D欄</option><option value="4">E欄</option><option value="5">F欄</option>
          <option value="6" selected>G欄</option><option value="-1">（無）</option>
        </select></div>
      <div class="col-item"><div class="lbl">照片2</div>
        <select id="col-p2">
          <option value="0">A欄</option><option value="1">B欄</option><option value="2">C欄</option>
          <option value="3">D欄</option><option value="4">E欄</option><option value="5">F欄</option>
          <option value="6">G欄</option><option value="7" selected>H欄</option><option value="-1">（無）</option>
        </select></div>
      <div class="col-item"><div class="lbl">照片3</div>
        <select id="col-p3">
          <option value="0">A欄</option><option value="1">B欄</option><option value="2">C欄</option>
          <option value="3">D欄</option><option value="4">E欄</option><option value="5">F欄</option>
          <option value="6">G欄</option><option value="7">H欄</option><option value="8" selected>I欄</option>
          <option value="-1">（無）</option>
        </select></div>
      <div class="col-item"><div class="lbl">照片4</div>
        <select id="col-p4">
          <option value="0">A欄</option><option value="1">B欄</option><option value="2">C欄</option>
          <option value="3">D欄</option><option value="4">E欄</option><option value="5">F欄</option>
          <option value="6">G欄</option><option value="7">H欄</option><option value="8">I欄</option>
          <option value="9" selected>J欄</option><option value="-1">（無）</option>
        </select></div>
    </div>
  </div>

  <div class="err" id="errMsg"></div>
  <div class="status-msg" id="statusMsg">⏳ 讀取中，請稍候...</div>

  <div class="action-bar" id="actionBar" style="display:none;">
    <button onclick="window.print()" class="primary">🖨️ 儲存成 PDF</button>
    <button onclick="copyGammaText()">📝 複製 Gamma 文字</button>
    <button onclick="downloadHTML()">⬇️ 下載客人版 HTML</button>
  </div>
  <div class="copy-notice" id="copyNotice">✓ 已複製！可直接貼入 Gamma</div>
</div>

<!-- ══ Document output ══ -->
<div id="doc-output"></div>

<script>
let hotelData = [];

function gc(id){ return parseInt(document.getElementById(id).value); }
function extractId(url){ const m=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/); return m?m[1]:null; }
function extractGid(url){ const m=url.match(/[#&?]gid=(\d+)/); return m?m[1]:'0'; }
function showErr(msg){ const e=document.getElementById('errMsg'); e.textContent=msg; e.style.display='block'; }
function hideErr(){ document.getElementById('errMsg').style.display='none'; }
function showStatus(){ document.getElementById('statusMsg').style.display='block'; }
function hideStatus(){ document.getElementById('statusMsg').style.display='none'; }

function calcNights(d){
  const m=d.match(/(\d+)\/(\d+)\s*[→\-~]\s*(\d+)\/(\d+)/);
  if(!m) return '';
  const y=new Date().getFullYear();
  const d1=new Date(y,parseInt(m[1])-1,parseInt(m[2]));
  let d2=new Date(y,parseInt(m[3])-1,parseInt(m[4]));
  if(d2<=d1) d2.setFullYear(y+1);
  const n=Math.round((d2-d1)/86400000);
  return n>0?n+'晚':'';
}

async function loadSheet(){
  hideErr();
  const url=document.getElementById('sheetUrl').value.trim();
  if(!url){showErr('請先貼入 Google Sheet 網址');return;}
  const id=extractId(url);
  if(!id){showErr('找不到有效的 Sheet ID');return;}
  const gid=extractGid(url);
  showStatus();
  document.getElementById('doc-output').innerHTML='';
  document.getElementById('actionBar').style.display='none';
  try{
    const res=await fetch('https://docs.google.com/spreadsheets/d/'+id+'/export?format=csv&gid='+gid);
    if(!res.ok) throw new Error('HTTP '+res.status);
    parseAndRender(await res.text());
  }catch(e){
    hideStatus();
    showErr('讀取失敗：'+e.message+'。請確認 Sheet 已設為「知道連結的人可以檢視」');
  }
}

function parseCSV(text){
  const rows=[]; let row=[],cell='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){inQ=!inQ;continue;}
    if(c===','&&!inQ){row.push(cell.trim());cell='';continue;}
    if((c==='\n'||c==='\r')&&!inQ){
      if(cell||row.length){row.push(cell.trim());rows.push(row);row=[];cell='';}
      if(c==='\r'&&text[i+1]==='\n')i++;
      continue;
    }
    cell+=c;
  }
  if(cell||row.length){row.push(cell.trim());rows.push(row);}
  return rows;
}

function parseAndRender(text){
  const rows=parseCSV(text);
  const catC=gc('col-cat'), locC=gc('col-loc'), nameC=gc('col-name');
  const dateC=gc('col-date'), descC=gc('col-desc');
  const pCols=[gc('col-p1'),gc('col-p2'),gc('col-p3'),gc('col-p4')];

  hotelData=[];
  rows.forEach((r,i)=>{
    if(i===0) return;
    const cat=catC>=0?(r[catC]||''):'';
    if(!cat.includes('住宿')) return;
    const name=nameC>=0?(r[nameC]||'').replace(/<[^>]+>/g,'').trim():'';
    if(!name) return;
    const sheetPhotos=[];
    pCols.forEach(pc=>{ if(pc>=0&&r[pc]&&r[pc].trim()) sheetPhotos.push(r[pc].trim()); });
    hotelData.push({
      id:i,
      location: locC>=0?(r[locC]||''):'',
      name,
      date: dateC>=0?(r[dateC]||''):'',
      desc: descC>=0?(r[descC]||''):'',
      sheetPhotos,
      uploadedPhotos: []
    });
  });

  hideStatus();
  if(hotelData.length===0){
    showErr('找不到「住宿」類別的資料，請確認欄位對應與類別欄文字');
    return;
  }
  renderDoc();
}

function allPhotos(h){ return [...h.sheetPhotos, ...h.uploadedPhotos.filter(Boolean)]; }

function renderDoc(){
  const out=document.getElementById('doc-output');
  let html='';

  // Cover
  html+='<div class="page">';
  html+='<div class="cover-eyebrow">飯店清單</div>';
  html+='<ul class="cover-list">';
  hotelData.forEach(h=>{
    html+='<li class="cover-row">';
    html+='<span class="cover-date">'+h.date+'</span>';
    html+='<span class="cover-loc">'+(h.location||'')+'</span>';
    html+='<span class="cover-name">'+h.name+'</span>';
    html+='</li>';
  });
  html+='</ul></div>';

  // Hotel pages
  hotelData.forEach(h=>{
    const photos=allPhotos(h);
    const nights=calcNights(h.date);
    const nightsStr=nights?' （'+nights+'）':'';

    const lines=h.desc.split('\n').map(l=>l.trim()).filter(l=>l);
    const roomLine=lines.find(l=>/^房型[：:]/.test(l));
    const roomVal=roomLine?roomLine.replace(/^房型[：:]\s*/,''):'';
    const featureLine=lines.find(l=>/^特色[：:]/.test(l));
    const featureVal=featureLine
      ? featureLine.replace(/^特色[：:]\s*/,'')
      : lines.filter(l=>!/^房型[：:]/.test(l)).join('　');

    const pCount=photos.length||2;
    const pClass=pCount===1?'p1':pCount===3?'p3':pCount===4?'p4':'';

    html+='<div class="page" id="hpage-'+h.id+'">';

    // Meta
    html+='<div class="hotel-meta">';
    html+='<div class="date-line">'+h.date+nightsStr+'</div>';
    if(h.location) html+='<div class="location-line">'+h.location+'</div>';
    html+='<div class="name-line">'+h.name+'</div>';
    html+='</div>';

    // Upload strip
    html+='<div class="upload-strip">';
    for(let i=0;i<4;i++){
      const has=!!h.uploadedPhotos[i];
      html+='<div class="upload-slot" id="uslot-'+h.id+'-'+i+'">';
      html+='<label>';
      html+='<input type="file" accept="image/*" onchange="handleUpload('+h.id+','+i+',this)">';
      html+='<span>'+(has?'<span class="fname">✓ 已上傳</span>':'📎 上傳照片 '+(i+1))+'</span>';
      html+='</label>';
      if(has) html+='<button class="rm-btn" style="display:flex;" onclick="removePhoto('+h.id+','+i+')">×</button>';
      html+='</div>';
    }
    html+='</div>';

    // Photos — always show slots (filled or placeholder)
    const displayCount = photos.length > 0 ? photos.length : 2;
    const displayClass = displayCount===1?'p1':displayCount===3?'p3':displayCount===4?'p4':'';
    html+='<div class="photos-wrap"><div class="photos-row '+displayClass+'">';
    for(let i=0;i<displayCount;i++){
      if(photos[i]){
        html+='<img src="'+photos[i]+'" alt="" onerror="this.style.display=\'none\'">';
      } else {
        html+='<div class="photo-placeholder">照片 '+(i+1)+'</div>';
      }
    }
    html+='</div></div>';

    // Info
    html+='<div class="info-section">';
    if(roomVal) html+='<div class="info-row"><span class="info-label">房型</span><span class="info-val">'+roomVal+'</span></div>';
    if(featureVal) html+='<div class="info-row"><span class="info-label">特色</span><span class="info-val">'+featureVal.replace(/\n/g,'<br>')+'</span></div>';
    html+='</div>';

    html+='</div>'; // .page
  });

  out.innerHTML=html;
  document.getElementById('actionBar').style.display='flex';
}

function handleUpload(hotelId, idx, input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const h=hotelData.find(h=>h.id===hotelId);
    if(!h) return;
    h.uploadedPhotos[idx]=e.target.result;
    renderDoc();
  };
  reader.readAsDataURL(file);
}

function removePhoto(hotelId, idx){
  const h=hotelData.find(h=>h.id===hotelId);
  if(!h) return;
  h.uploadedPhotos[idx]=null;
  renderDoc();
}

function copyGammaText(){
  const prompt = '建立一個旅遊飯店清單文件，包含以下結構：\n\n' +
    '【第一頁 - 飯店清單總覽】\n' +
    '標題：飯店清單\n' +
    '格式：項目列表，每項包含日期範圍、地點、飯店名稱（加超連結）\n\n' +
    '【後續頁面 - 每間飯店詳細介紹】\n' +
    '每間飯店一頁，包含：\n' +
    '- 標題：日期範圍　地點　飯店名稱\n' +
    '- 房型：[房型名稱]\n' +
    '- 特色：[2-3句特色描述]\n' +
    '- 圖片區：2-4張飯店照片（方形圖片網格排列）\n\n' +
    '【設計要求】\n' +
    '- 使用優雅、高級的設計風格\n' +
    '- 保持簡潔專業的排版\n' +
    '- 圖片使用方形網格展示\n' +
    '- 適合作為客人參考資料\n\n' +
    '【飯店資訊】\n' +
    '日期 → 日期 | 地點 | 飯店名稱 | 房型 | 特色描述 | 飯店連結\n\n';

  let rows = '';
  hotelData.forEach(h => {
    const lines = h.desc.split('\n').map(l => l.trim()).filter(l => l);
    const roomLine = lines.find(l => /^房型[：:]/.test(l));
    const roomVal = roomLine ? roomLine.replace(/^房型[：:]\s*/, '').trim() : '—';
    const featureLine = lines.find(l => /^特色[：:]/.test(l));
    const otherLines = lines.filter(l => !/^房型[：:]/.test(l) && !/^特色[：:]/.test(l));
    const featureVal = featureLine
      ? featureLine.replace(/^特色[：:]\s*/, '').trim()
      : otherLines.join('，');
    const date = h.date.replace(/\s/g, ' ').trim();
    const loc = h.location || '—';
    const link = h.link || '（請補上連結）';
    rows += date + ' | ' + loc + ' | ' + h.name + ' | ' + roomVal + ' | ' + featureVal + ' | ' + link + '\n';
  });

  const fullText = prompt + rows;
  navigator.clipboard.writeText(fullText).then(() => {
    const el = document.getElementById('copyNotice');
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  });
}
